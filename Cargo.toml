[workspace]
resolver = "3"
members = ["crates/gdview", "crates/gdproject", "crates/gdkit"]
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xandwrp/godotkit"

[workspace.dependencies]
gdview = { path = "crates/gdview" }
gdproject = { path = "crates/gdproject" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1.8"
toml = "0.8"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
anstream = "1"
unicode-ident = "1"
tempfile = "3"

[workspace.lints.rust]
unused_variables = "allow" # scaffold: bodies are todo!(); remove once implemented
dead_code = "allow"        # scaffold: same; remove once implemented
