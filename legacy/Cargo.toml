[package]
name = "gdkit"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust utility belt for Godot."
license = "MIT OR Apache-2.0"

[dependencies]
anstream = "1.0"
blake3 = "1.8"
clap = { version = "4.6.6", features = ["derive"] }
gdview = { git = "https://github.com/xandwr/gdview", rev = "49df9290891f9bbf5708eabbc59f56dfc1cf263d" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
pathdiff = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
